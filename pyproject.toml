[project]
name = "livestream-scheduler"
version = "0.1.0"
description = "Automatically schedule YouTube livestreams for Minnehaha UMC from a calendar feed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "icalendar>=6,<7",
    "recurring-ical-events>=3,<4",
    "click>=8.1",
    "pydantic>=2,<3",
    "PyYAML>=6",
    "requests>=2.32",
    "platformdirs>=4",
]

[project.scripts]
livestream-scheduler = "livestream_scheduler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "time-machine>=2.15",
    "responses>=0.25",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livestream_scheduler"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*", "google.auth.*", "recurring_ical_events.*", "icalendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to a real YouTube test channel (opt-in, LSS_LIVE_TEST=1)"]
addopts = "-m 'not live'"
